name: Template Bundle Check

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'templates/**'
      - 'dist/**'
      - '.github/scripts/bundle_templates.py'

jobs:
  bundle-fresh:
    name: dist/templates.toml 是否为最新
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check bundle is up to date
        run: |
          # dist/templates.toml 是 WebUI 在线模板库一次性拉取的聚合文件（替代逐文件 700+ 次请求）。
          # 合入模板改动后必须重新生成，否则用户端会停在旧目录 / 退回逐文件慢路径。
          if ! python .github/scripts/bundle_templates.py --check; then
            echo "::error::templates/ 有改动但 dist/templates.toml 未更新。请在仓库根运行："
            echo "::error::  python .github/scripts/bundle_templates.py"
            echo "::error::然后一并提交 dist/templates.toml（记得同步 Gitee 镜像）。"
            exit 1
          fi
